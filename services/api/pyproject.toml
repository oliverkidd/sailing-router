[project]
name = "sailing-router-api"
version = "0.1.0"
description = "Local-first UK+Med sailing weather router backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "httpx>=0.27",
    "shapely>=2.0",
    "pyproj>=3.6",
    "python-multipart>=0.0.9",
    "weatherrouting>=0.6",
    "scikit-image>=0.24",
    "pyshp>=2.3",
    # GRIB pipeline (native forecast sources)
    "cfgrib>=0.9",
    "eccodes>=1.6",
    "xarray>=2024.6",
    "scipy>=1.11",
    "zarr>=2.18",
    "ecmwf-opendata>=0.3",
]

[project.optional-dependencies]
# Optional heavy extras not required for the GRIB wind path.
extras = [
    "netCDF4>=1.6",
    "rasterio>=1.3",
    "copernicusmarine>=1.3",
]
dev = [
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's File()/Form()/Depends() in defaults is the idiomatic pattern.
ignore = ["E501", "B008"]
