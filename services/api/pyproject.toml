[project]
name = "sailing-router-api"
version = "0.1.0"
description = "Local-first UK+Med sailing weather router backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "httpx>=0.27",
    "shapely>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavy / native-dep extras. Open-Meteo default path does NOT need these.
metocean = [
    "xarray>=2024.6",
    "netCDF4>=1.6",
    "rasterio>=1.3",
    "cfgrib>=0.9",
    "ecmwf-opendata>=0.3",
    "copernicusmarine>=1.3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's File()/Form()/Depends() in defaults is the idiomatic pattern.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
