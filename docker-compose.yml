# Pins the fiddly native deps (eccodes for GRIB, WindNinja for orographic wind)
# so a cold checkout can run the full stack. The backend image bundles both;
# the frontend runs via node. Local-first: no external services required.
services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    image: sailing-router-api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
      - ./data:/data
    environment:
      - SAILING_DATA_DIR=/data
      - SAILING_CACHE_DIR=/data/cache
      # Optional: mount a Copernicus token; FES offline fallback works without it.
      - COPERNICUSMARINE_SERVICE_USERNAME=${COPERNICUSMARINE_SERVICE_USERNAME:-}
      - COPERNICUSMARINE_SERVICE_PASSWORD=${COPERNICUSMARINE_SERVICE_PASSWORD:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    command: sh -c "npm install && npm run dev"
